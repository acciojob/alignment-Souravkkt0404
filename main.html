<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Assignment 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* General Table Styling */
        table.middle {
            width: 100%;
            border-collapse: separate;
            border-spacing: 1px;
            border: 1px solid black;
            margin-bottom: 30px;
        }

        td {
            border: 1px solid black;
            padding: 1px;
        }

        /* Alignment Classes */
        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }

        .left {
            text-align: left;
        }

        /* Color Classes */
        .green {
            background-color: green;
            height: 20px;
        }

        .blue {
            background-color: blue;
            height: 20px;
        }

        /* Specific Table Adjustments */
        #table-1 td {
            height: 20px;
        }

        #table-2 td {
            height: 20px;
        }

        #table-3 td {
            padding: 0;
        }

        #t-image {
            text-align: center;
            vertical-align: middle;
            padding: 10px 0;
        }

        #t-image img {
            max-width: 300px;
            height: auto;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">HTML Assignment #3</h1>

    <table id="table-1" class="middle">
        <tr>
            <td id="t11" class="left">left</td>
            <td id="t12" class="center">center</td>
            <td id="t13" class="right">right</td>
        </tr>
        <tr class="center right">
            <td class="left">left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>
        <tr>
            <td class="left">left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>
    </table>

    <table id="table-2" class="middle">

            <td id="t21" colspan="6"></td>

        </tr>
        <tr>
            <td></td>

    <table id="table-3" class="middle">
        <tr class="green">
            <td colspan="3"></td>
        </tr>
        <tr>
            <td style="width: 33%;"></td>
            <td id="t-image" style="width: 34%;">
                <img src="https://m.media-amazon.com/images/I/61y8B3G6i+L._AC_SL1000_.jpg" alt="Michael Jordan Dunk">
            </td>

        </tr>
        <tr class="blue">

        </tr>
    </table>

</body>
</html>
